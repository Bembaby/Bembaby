name: Draw the profile banner and snake

# Every six hours so the streak stays current, and on every push to main.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Draw the banner
        run: node scripts/card.mjs dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draw the snake in the banner's blues
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0b0cf0&color_dots=#ebedf0,#cfd1ff,#8f95ff,#4f57ff,#0b0cf0
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f4f4ff&color_dots=#161b22,#1f2370,#2f36c4,#4f57ff,#9aa0ff

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
